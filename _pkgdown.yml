url: https://ryanzomorrodi.github.io/healthatlas/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    pkgdown-nav-height: 80px
    navbar-padding-y: 1.25rem
    base_font: {google: "Inter"}
    heading_font: {google: "Plus Jakarta Sans"}
    code_font: {google: "JetBrains Mono"}
    headings-font-weight: 700

    body-bg: "#f7f7f8"
    body-color: "#1c252e"
    navbar-light-bg: "#ffffff"

    body-bg-dark: "#0e141b"
    body-color-dark: "#e1e7ec"
    navbar-dark-bg: "#131b24"

reference:
- title: Get and Set Portal
  contents:
  - ha_get
  - ha_set

- title: Tabular Data
  subtitle: Explore data
  contents:
  - ha_topics
  - ha_subcategories
  - ha_coverage

- subtitle: Import data
  contents:
  - ha_data

- title: Spatial Data
  subtitle: Geographic layers
  contents:
  - ha_layers
  - ha_layer

- subtitle: Point layers
  contents:
  - ha_point_layers
  - ha_point_layer
